<div class="container py-4">
  <h1 class="mb-3">Products</h1>

  <div class="row g-2 mb-3">
    <div class="col-md-5">
      <input
        class="form-control"
        placeholder="Search by title"
        [(ngModel)]="q"
        (keyup.enter)="onSearch()"
      />
    </div>
    <div class="col-md-4">
      <select class="form-select" [(ngModel)]="category" (change)="onCategoryChange()">
        <option value="">All categories</option>
        <option *ngFor="let c of categories()" [value]="c.name">{{ c.name }}</option>
      </select>
    </div>
    <div class="col-md-3">
      <button class="btn btn-primary w-100" (click)="onSearch()">Search</button>
    </div>
  </div>

  <p class="text-muted" *ngIf="loading()">Loading...</p>
  <p class="text-danger" *ngIf="error()">{{ error() }}</p>

  <div class="row g-3" *ngIf="!loading() && !error()">
    <div class="col-md-4" *ngFor="let p of products()">
      <div class="card h-100">
        <img [src]="p.thumbnail" class="card-img-top" [alt]="p.title" />
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ p.title }}</h5>
          <p class="card-text text-muted small">{{ p.category.name }}</p>
          <p class="fw-bold">{{ price(p.price) }} €</p>
          <a class="btn btn-outline-primary mt-auto" [routerLink]="['/products', p.id]">Details</a>
        </div>
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-center mt-4">
    <button class="btn btn-secondary" (click)="prev()" [disabled]="skip === 0">Previous</button>
    <span>{{ skip + 1 }} - {{ skip + products().length }} of {{ total() }}</span>
    <button class="btn btn-secondary" (click)="next()" [disabled]="skip + limit >= total()">Next</button>
  </div>
</div>
