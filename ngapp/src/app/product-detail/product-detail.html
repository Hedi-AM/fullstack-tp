<div class="container py-4">
  <a class="btn btn-secondary mb-3" routerLink="/products">Back to catalogue</a>

  <p class="text-danger" *ngIf="error()">{{ error() }}</p>

  <div *ngIf="product() as p" class="row g-4">
    <div class="col-md-5">
      <img [src]="p.thumbnail" class="img-fluid border rounded p-3" [alt]="p.title" />
    </div>
    <div class="col-md-7">
      <h1>{{ p.title }}</h1>
      <p class="text-muted">{{ p.category.name }}</p>
      <p>{{ p.description }}</p>
      <p class="fs-4 fw-bold">{{ price(p.price) }} €</p>
      <p>Stock: {{ p.stock }}</p>
    </div>
  </div>

  <div *ngIf="product()?.reviews?.length" class="mt-4">
    <h2 class="h4">Reviews</h2>
    <div class="border rounded p-2 mb-2" *ngFor="let r of product()?.reviews">
      <strong>{{ r.reviewerName }}</strong> — {{ r.rating }}/5
      <p class="mb-0">{{ r.comment }}</p>
    </div>
  </div>
</div>
