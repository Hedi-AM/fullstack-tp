<div class="container py-4">
  <h1 class="mb-3">Admin products</h1>

  <p class="text-danger" *ngIf="error()">{{ error() }}</p>

  <div class="border rounded p-3 mb-4">
    <h2 class="h5">{{ editId ? 'Edit product' : 'Create product' }}</h2>

    <div class="row g-2">
      <div class="col-md-6">
        <input class="form-control" placeholder="Title" [(ngModel)]="form.title" />
      </div>
      <div class="col-md-3">
        <input class="form-control" type="number" placeholder="Price" [(ngModel)]="form.price" />
      </div>
      <div class="col-md-3">
        <input class="form-control" type="number" placeholder="Stock" [(ngModel)]="form.stock" />
      </div>
      <div class="col-md-6">
        <input class="form-control" placeholder="Thumbnail URL" [(ngModel)]="form.thumbnail" />
      </div>
      <div class="col-md-6">
        <input class="form-control" placeholder="Category name" [(ngModel)]="form.category" />
      </div>
      <div class="col-12">
        <textarea class="form-control" rows="2" placeholder="Description" [(ngModel)]="form.description"></textarea>
      </div>
    </div>

    <div class="mt-2 d-flex gap-2">
      <button class="btn btn-primary" (click)="save()">Save</button>
      <button class="btn btn-secondary" (click)="reset()">Cancel</button>
    </div>
  </div>

  <table class="table table-sm align-middle">
    <thead>
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Category</th>
        <th>Price</th>
        <th>Stock</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of products()">
        <td>{{ p.id }}</td>
        <td>{{ p.title }}</td>
        <td>{{ p.category.name }}</td>
        <td>{{ p.price }}</td>
        <td>{{ p.stock }}</td>
        <td class="text-end">
          <button class="btn btn-sm btn-outline-primary me-1" (click)="edit(p)">Edit</button>
          <button class="btn btn-sm btn-outline-danger" (click)="remove(p.id)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
