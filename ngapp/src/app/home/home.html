<button (click)="gotoLogin()">Login Page</button>
<button (click)="gotoContact()">Contact Page</button>
<button (click)="goBack()">Back</button>

<app-child [content]="content" [states]="states" (selected)="onSelected($event)" />
<p>Selected: {{ chosen }}</p>

<input #newState type="text" placeholder="New state" />
<button (click)="addState(newState.value); newState.value = ''">Add state</button>
