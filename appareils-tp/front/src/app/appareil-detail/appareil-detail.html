@if (appareil) {
  <div class="card">
    <div class="card-body">
      <h2 class="card-title">{{ appareil.name }}</h2>
      <p
        class="card-text fs-5"
        [class.text-success]="appareil.status === 'On'"
        [class.text-danger]="appareil.status === 'Off'"
      >
        Status: {{ appareil.status }}
      </p>
      <a class="btn btn-warning" routerLink="/appareils">Back</a>
    </div>
  </div>
} @else {
  <div class="alert alert-danger">Appliance not found.</div>
  <a class="btn btn-warning" routerLink="/appareils">Back</a>
}
