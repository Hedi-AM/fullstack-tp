<h2 class="mb-3">Appliances</h2>

<div class="mb-4">
  <button class="btn btn-success me-2" [disabled]="!allowed()" (click)="onSwitchOnAll()">
    Switch on all
  </button>
  <button class="btn btn-danger" (click)="onSwitchOffAll()">Switch off all</button>
</div>

<ul class="list-unstyled">
  @for (a of appareilList; track a.name; let i = $index) {
    <app-appareil
      [appareilName]="a.name"
      [appareilStatus]="a.status"
      [index]="i"
      (switchOn)="onSwitch(i, 'On')"
      (switchOff)="onSwitch(i, 'Off')"
    />
  }
</ul>
